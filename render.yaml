services:
  - type: web
    name: requiem-code-we-buried
    runtime: static
    rootDir: frontend
    buildCommand: npm install && VITE_PUBLIC_EXHIBIT=true npm run build
    staticPublishPath: ./dist
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
